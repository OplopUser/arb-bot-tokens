[package]
name = "arb-bot"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"

[dependencies]
anyhow = "1.0"
axum = "0.8"
base64 = "0.22"
bincode = "1.3"
bs58 = "0.5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive", "env"] }
dotenvy = "0.15"
futures-util = "0.3"
hmac = "0.12"
rayon = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmpv = { version = "1.3", features = ["with-serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
solana-address = { version = "2.6", default-features = false, features = ["copy", "curve25519"] }
solana-sdk = "2.3.1"
swaps = { version = "0.1.1", default-features = false, features = ["raydium-amm-v4", "raydium-clmm", "raydium-cpmm", "orca-whirlpool", "meteora-pools", "meteora-damm-v2", "meteora-dlmm"] }
thiserror = "2.0"
tokio = { version = "1.48", features = ["fs", "macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
pretty_assertions = "1.4"
