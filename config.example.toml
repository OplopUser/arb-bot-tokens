# Documented token/native-pool profile and template for your own config.toml:
#
#   cp config.example.toml config.toml
#
# Used as-is by the `npm run tokens:*` / `rust:run` scripts. It inspects live
# opportunities and, when a wallet is present, builds, signs and simulates
# candidates, but it never submits a transaction while
# execution.submit_enabled = false. For a read-only scan with no wallet and no
# signing, see config.minimal.toml.

[rpc]
primary_http = "https://api.mainnet-beta.solana.com"
# Leave blank to derive wss:// from primary_http. For real runs, use a private
# low-latency RPC in config.toml or edit this value.
primary_ws = ""
# Extra HTTP endpoints, also used when sending. Example: ["env:FALLBACK_RPC_URL"]
fallback_http = []
commitment = "processed"
request_timeout_ms = 2500

[wallet]
# This file is ignored by git. Required for live balance checks and simulations.
path = ".secrets/wallet.json"

[database]
enabled = true
path = ".arb/tokens.db"
migrations_on_startup = true
busy_timeout_ms = 5000

[trading]
# true enables the execution pipeline (re-quote, build, sign, simulate). It does
# not submit on its own: see [execution].submit_enabled.
live = true
trade_size_usd = 25.0
min_net_profit_bps = 15.0
fee_safety_buffer_bps = 5.0
max_active_tokens = 100
scan_interval_ms = 1000
quote_mints = [
  "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v", # USDC
  "Es9vMFrzaCERmJfrF4H2FYD4KCoNkY11McCe8BenwNYB", # USDT
  "So11111111111111111111111111111111111111112",  # WSOL
]
major_denylist = [
  "So11111111111111111111111111111111111111112",
  "JUPyiwrYJFskUPiHa7hkeR8VUtAeFoSYbKedZNsDvCN",
  "4k3Dyjzvzp8eMZWUXbBCjEvwSkkk59S5iCNLY3QrkX6R",
  "orcaEKTdK7LKz57vaAYr9QeNsVEPfiu6QeMU1kektZE",
]
sol_usd_estimate = 100.0

[rwa]
enabled = false
execution_enabled = false

[discovery]
enabled = true
index_enabled = true
index_url = "https://api.dexscreener.com/latest/dex/tokens"
max_index_pairs_per_token = 24
min_index_liquidity_usd = 25000.0
broad_rpc_enabled = false
refresh_interval_ms = 300000

[fees]
priority_fee_percentile = 75.0
max_priority_fee_lamports = 250000
jito_tip_lamports = 0
max_jito_tip_lamports = 0
ata_rent_lamports = 2039280
base_fee_lamports = 5000

[simulation]
enabled = false
max_history = 100
max_trades_per_cycle = 1
min_interval_ms = 10000

[execution]
enabled = true
# Keep false. Submission additionally requires the arming env gates and a
# non-zero session risk budget (see README, "Safety design").
submit_enabled = false
execution_profile = "token_probe_no_submit"
max_live_smoke_trade_usd = 1.0
max_live_trade_usd = 25.0
min_absolute_profit_usd = 0.01
max_live_trades_per_session = 0
max_live_trades_per_cycle = 0
max_live_candidates_per_cycle = 3
min_interval_ms = 0
jupiter_requests_per_window = 90
jupiter_window_ms = 60000
jupiter_estimated_requests_per_candidate = 2
jupiter_rate_limit_cooldown_ms = 60000
jupiter_probe_enabled = true
min_requote_profit_bps = 15.0
require_simulation = true
confirmation_timeout_ms = 45000
jupiter_swap_url = "https://lite-api.jup.ag/swap/v1/swap"
jupiter_swap_instructions_url = "https://lite-api.jup.ag/swap/v1/swap-instructions"
jupiter_only_direct_routes = true
jupiter_use_venue_filters = true
jupiter_max_accounts = 32
compute_unit_limit = 1400000
compute_unit_price_micro_lamports = 0
stale_candidate_ttl_ms = 250
native_prefunded_hot_accounts = false
address_lookup_tables = []
native_price_only_execution_enabled = true
native_scout_min_net_profit_bps = 0.0
jupiter_probe_trade_sizes_usd = [2.0, 5.0, 10.0, 25.0, 50.0, 100.0]
direct_trade_sizes_usd = [1.0, 5.0, 10.0, 25.0, 50.0, 100.0]
ws_subscription_budget = 128
jito_block_engine_url = ""
max_pool_slot_age = 50
